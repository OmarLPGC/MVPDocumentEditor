[tool.poetry]
name = "prueba-sdd-editor"
version = "0.1.0"
description = "Editor de texto tipo Word - MVP (Spec-Driven Development)"
authors = ["Equipo"]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
PySide6 = "^6.6"
Pillow = "^10.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
pytest-qt = "^4.0"
black = "^24.0"
isort = "^5.0"
flake8 = "^7.0"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
